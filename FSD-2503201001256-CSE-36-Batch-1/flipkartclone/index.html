<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipkart Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<div class="logo">
<h2>Flipkart</h2>
</div>

<div class="search">
<input type="text" placeholder="Search for Products, Brands and More">
</div>

<button class="login">Login</button>

</header>

<nav>

<ul>
<li>Mobiles</li>
<li>Fashion</li>
<li>Electronics</li>
<li>Home</li>
<li>Appliances</li>
<li>Travel</li>
<li>Beauty</li>
<li>Furniture</li>
</ul>

</nav>

<section class="slider">

<img id="slide" src="https://picsum.photos/1200/300?1">

</section>

<section class="products">

<div class="card">
<img src="https://picsum.photos/200?1">
<h3>iPhone 15</h3>
<p>₹69,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?2">
<h3>Samsung TV</h3>
<p>₹45,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?3">
<h3>Laptop</h3>
<p>₹54,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?4">
<h3>Headphones</h3>
<p>₹2,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?5">
<h3>Shoes</h3>
<p>₹1,499</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?6">
<h3>Watch</h3>
<p>₹3,999</p>
<button>Add to Cart</button>
</div>

</section>

<footer>

<p>© 2026 Flipkart Clone | Made with HTML CSS JavaScript</p>

</footer>

<script src="script.js"></script>

</body>
</html>
